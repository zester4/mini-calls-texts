name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: minicalls
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d minicalls"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:${{ github.run_id }}@localhost:5432/minicalls
      NODE_ENV: test
      APP_API_KEY: test-api-key-that-is-long-enough-for-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Report dependency audit findings
        run: |
          npm audit --json > audit-report.json || true
          node -e "const a=require('./audit-report.json'); console.log('Dependency vulnerabilities:', JSON.stringify(a.metadata?.vulnerabilities ?? {})); for (const [name, item] of Object.entries(a.vulnerabilities ?? {})) console.log(name + ': ' + JSON.stringify(item));"
      - name: Enforce high-severity dependency audit
        run: npm audit --audit-level=high
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test
